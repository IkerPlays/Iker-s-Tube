name: Build 3DSX + CIA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas del sistema
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Diagnostico de librerias devkitPro
        run: |
          ls /opt/devkitpro/portlibs/3ds/lib | head -50
          dkp-pacman -Q | grep -i "mbedtls\|zlib\|libctru\|citro" || true

      - name: Compilar makerom y bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Compilar .3dsx y .cia
        run: make MAKEROM=makerom BANNERTOOL=bannertool

      - uses: actions/upload-artifact@v4
        with:
          name: IkersTube
          path: |
            IkersTube_dev.cia
            IkersTube.3dsx
