name: Build 3DSX + CIA

# Devbuilds are NOT published automatically : run this workflow by hand (Actions > Build 3DSX + CIA > Run workflow
# on main) when enough commits have piled up. Pull requests are only built (nothing is published).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish devbuild releases

# On main a running build is never cancelled (otherwise a quick second push would skip its release);
# at most one newer run waits in the queue and replaces older waiting ones. Other branches cancel old runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Version of this build : "<core>-dev.<run number>".
  # <core> is the VERSION file, but never lower than the latest STABLE release you published : once 1.0.0 is
  # out, devbuilds become 1.0.1-dev.N (which the app sees as newer than 1.0.0).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(tr -d '[:space:]' < VERSION)
          IFS=. read -r a b c <<< "$core"
          core="${a:-0}.${b:-0}.${c:-0}"
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 \
                     --json tagName --jq '.[].tagName' | sed 's/^v//' \
                     | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$stable" ] && [ "$(printf '%s\n%s\n' "$core" "$stable" | sort -V | tail -1)" = "$stable" ]; then
            IFS=. read -r a b c <<< "$stable"
            core="$a.$b.$((c + 1))"
          fi
          echo "version=${core}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: System tools
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Build makerom and bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Build .3dsx and .cia
        env:
          STUDIO_CLIENT_ID: ${{ secrets.STUDIO_CLIENT_ID }}
          STUDIO_CLIENT_SECRET: ${{ secrets.STUDIO_CLIENT_SECRET }}
        run: make MAKEROM=makerom BANNERTOOL=bannertool IKT_VERSION=${{ needs.version.outputs.version }} IKT_STUDIO_CLIENT_ID="$STUDIO_CLIENT_ID" IKT_STUDIO_CLIENT_SECRET="$STUDIO_CLIENT_SECRET"

      - name: Collect files
        run: |
          mkdir dist
          cp IkersTube_dev.cia dist/IkersTube.cia
          cp IkersTube.3dsx dist/IkersTube.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: IkersTube
          path: dist/

  # Devbuilds are published from main only, and only when this workflow is run by hand. Every devbuild is its own
  # pre-release (tag v<version>); only the newest 15 of each version line are kept (older ones are pruned).
  # To ship a stable version, publish a normal (non pre-release) release yourself with IkersTube.cia and
  # IkersTube.3dsx attached: the app installs it automatically, while devbuilds are only offered.
  release:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: IkersTube
          path: dist

      - name: Publish devbuild
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "# Iker's Tube ${VERSION} (devbuild)"
            echo
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo "Development build ${VERSION} from commit \`${GITHUB_SHA::7}\`."
            echo "Development builds are for testing and may be unstable."
          } > notes.md
          gh release create "v${VERSION}" dist/IkersTube.cia dist/IkersTube.3dsx \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Iker's Tube ${VERSION} (devbuild)" \
            --notes-file notes.md

      - name: Keep only the newest 15 devbuilds per version line
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-devbuilds.sh 15
