name: Build 3DSX + CIA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the "devbuild" release

# a newer push cancels the older run, so the devbuild release always comes from the latest commit
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version (VERSION + numero de build)
        id: ver
        run: |
          echo "version=$(cat VERSION | tr -d '[:space:]').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Herramientas del sistema
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      - name: Compilar makerom y bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      - name: Compilar .3dsx y .cia
        run: make MAKEROM=makerom BANNERTOOL=bannertool IKT_VERSION=${{ steps.ver.outputs.version }}

      - name: Preparar ficheros
        run: |
          mkdir dist
          cp IkersTube_dev.cia dist/IkersTube.cia
          cp IkersTube.3dsx dist/IkersTube.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: IkersTube
          path: dist/

  # Publica (o reemplaza) el release "devbuild" con el ultimo build. El actualizador de la app lo detecta.
  # Si publicas tu mismo un release normal (p. ej. tag v1.1 con .cia y .3dsx), se considera mas nuevo mientras su
  # numero de version sea mayor que el del devbuild.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: IkersTube
          path: dist

      - name: Publicar devbuild
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "# Iker's Tube ${VERSION}"
            echo
            cat RELEASE_NOTES.md
            echo
            echo "---"
            echo "<sub>Build automático · versión **${VERSION}** · commit \`${GITHUB_SHA::7}\`</sub>"
          } > notes.md
          gh release delete devbuild --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create devbuild dist/IkersTube.cia dist/IkersTube.3dsx \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Iker's Tube $VERSION (devbuild)" \
            --notes-file notes.md
